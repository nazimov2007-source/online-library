<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — КнигоМир</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">📚 КнигоМир</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="catalog.html" class="nav__link nav__link--active">Каталог</a>
        <a href="login.html" class="nav__link">Вход</a>
        <a href="register.html" class="nav__link nav__link--btn">Регистрация</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">🌙</button>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">Каталог книг</h1>

    <div class="catalog-controls">
      <input type="search" id="searchInput" class="input"
             placeholder="Поиск по названию или автору...">
      <select id="genreFilter" class="input">
        <option value="">Все жанры</option>
        <option value="Роман">Роман</option>
        <option value="Фантастика">Фантастика</option>
        <option value="Детектив">Детектив</option>
        <option value="Фэнтези">Фэнтези</option>
      </select>
    </div>

    <div class="catalog" id="catalog">
      <!-- Карточки рендерятся через JS -->
    </div>

    <p class="catalog-empty" id="emptyMessage" hidden>Ничего не найдено 😔</p>
  </main>

  <footer class="footer">
    <div class="container"><p>© 2026 КнигоМир. Учебный проект.</p></div>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
